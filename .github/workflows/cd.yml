name: CD

# Запускается после успешного CI в ветке master
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish image to GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
      SHA: ${{ needs.publish.outputs.sha }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Секрет RENDER_DEPLOY_HOOK_URL не задан — деплой пропущен"
            exit 0
          fi
          image=$(jq -rn --arg v "$IMAGE:$SHA" '$v|@uri')
          curl -fsS -X POST "$HOOK&imgURL=$image" > /dev/null
          echo "Запрошен деплой образа $IMAGE:$SHA"

      - name: Wait until new version is live
        if: env.APP_URL != '' && env.HOOK != ''
        run: |
          for i in $(seq 1 40); do
            version=$(curl -fsS "$APP_URL/health" | jq -r .version || true)
            echo "Попытка $i: версия на сервере — ${version:-нет ответа}"
            [ "$version" = "$SHA" ] && exit 0
            sleep 15
          done
          echo "::error::Новая версия $SHA не появилась на $APP_URL"
          exit 1
