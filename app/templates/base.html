<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Генератор оправданий{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="/">Генератор оправданий</a></h1>
    <nav>
      {% if username %}<a href="/history/{{ username | urlencode }}">Моя история</a>{% endif %}
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Учебный проект по дисциплине «Разработка на Python».
  </footer>
</body>
</html>
