services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: excuses
      POSTGRES_PASSWORD: excuses
      POSTGRES_DB: excuses
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excuses -d excuses"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://excuses:excuses@db:5432/excuses
      TIMEZONE: Asia/Yakutsk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
